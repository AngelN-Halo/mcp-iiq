:root{--bg:#fff;--text:#202b2b;--muted:#687676;--line:#e5eaea;--soft:#f7f9f9;--accent:#08786a;--tint:#edf8f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 'DM Sans',sans-serif}button,input{font:inherit}a{color:inherit;text-decoration:none}button,a,input{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 32px;position:sticky;top:0;background:var(--bg);z-index:20}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.8px;white-space:nowrap}.logo{width:29px;height:29px;background:#173e37;color:#8ce4bd;display:grid;place-items:center;border-radius:7px;font-family:monospace;font-size:24px}.version{font:11px 'IBM Plex Mono',monospace;color:var(--muted);border:1px solid var(--line);padding:4px 7px;border-radius:5px;margin-left:4px}.toplinks{display:flex;gap:25px;margin-left:30px;height:100%;align-items:center;font-size:13px}.toplinks a:first-child{border-bottom:2px solid var(--accent);height:100%;display:flex;align-items:center;color:var(--accent)}.searchTrigger{margin-left:auto;width:260px;text-align:left;background:var(--soft);border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:7px;display:flex;align-items:center;gap:10px;font-size:13px}kbd{font:11px 'IBM Plex Mono';border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:auto}.github{font-size:13px;white-space:nowrap}.menu{display:none;background:none;border:0;font-size:23px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{border-right:1px solid var(--line);padding:32px 20px 24px 26px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;display:flex;flex-direction:column}.navgroup{font-size:11px;letter-spacin g:23px 24px 19px}.smalllabel{font:10px 'IBM Plex Mono';letter-spacing:1px;color:var(--muted);text-transform:uppercase}.flow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:21px 0}.node{background:var(--bg);border:1px solid var(--line);padding:13px 16px;border-radius:7px;flex:1;text-align:center;font-size:13px;line-height:1.4}.node strong{display:block;font-weight:600}.node small{font-size:10px;color:var(--muted)}.node.selected{border-color:#91bdab;background:var(--tint)}.arrow{color:#94a69c}.flowcaption{font-size:11px;color:var(--muted);text-align:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.card{border:1px solid var(--line);border-radius:8px;padding:21px;transition:border-color .15s,background .15s}.card:hover{border-color:#8cbda9;background:var(--soft)}.cardicon{color:var(--accent);font:21px 'IBM Plex Mono';margin-bottom:17px}.card p{font-size:13px;line-height:1.6;margin:5px 0 0}.card h3 span{float:right;color:#a0ada7}code{font:12px 'IBM Plex Mono',monospace;background:var(--soft);border:1px solid var(--line);padding:2px 5px;border-radius:4px;color:var(--text);overflow-wrap:anywhere}.codebox{background:#182220;color:#d5e2dc;border:1px solid #263a31;border-radius:8px;margin:18px 0;overflow:hidden}.codehead{background:#202d29;padding:9px 16px;font:11px 'IBM Plex Mono';color:#a6b9b0;display:flex;justify-content:space-between;align-items:center}.copy{color:#c2d6cb;background:transparent;border:0;font-size:11px}.codebox pre{padding:17px 20px;margin:0;overflow:auto;font:12px/1.9 'IBM Plex Mono',monospace;tab-size:2}.codebox code{background:none;border:0;color:inherit;padding:0;white-space:pre;overflow-wrap:normal}.note{display:flex;gap:12px;background:var(--tint);border:1px solid #dcece4;border-radius:7px;padding:14px 17px;font-size:12px;color:#3c6a58;margin:22px 0}.note strong{font-weight:600}.note p{margin:0;color:inherit}.sectionrule{border-top:1px solid var(--line);margin-top:34px}.toc{position:sticky;top:112px;height:fit-content;font-size:12px;padding-top:7px}.toc strong{display:block;font-size:11px;font-weight:600;margin-bottom:15px}.toc a{display:block;border-left:1px solid var(--line);padding:6px 0 6px 14px;color:var(--muted)}.toc a:hover{color:var(--accent);border-color:var(--accent)}.toc .help{border-top:1px solid var(--line);margin-top:30px;padding-top:20px;color:var(--muted);font-size:11px}.help a{border:0;padding:6px 0;color:var(--accent)}footer{border-top:1px solid var(--line);margin-top:34px;padding-top:18px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:12px}.next{border:1px solid var(--line);padding:16px 20px;border-radius:8px;display:block;text-align:right;margin:25px 0}.next small{display:block;color:var(--muted);font-size:11px}.next strong{font-size:14px;font-weight:500;color:var(--accent)}table{border-collapse:collapse;width:100%;font-size:12px;margin:18px 0}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);font-weight:500}td{color:var(--muted)}li{color:var(--muted);margin:7px 0}.get{font:10px 'IBM Plex Mono';color:var(--accent);background:var(--tint);padding:3px 5px;margin-right:8px;border-radius:4px}.endpoint{padding:16px;border:1px solid var(--line);border-radius:7px;margin:12px 0}.endpoint p{font-size:13px;margin-bottom:0}.endpoint code{border:0;background:none}.tablewrap{overflow-x:auto}dialog{padding:0;border:1px solid var(--line);border-radius:12px;width:min(600px,90vw);color:var(--text);box-shadow:0 30px 90px #0003}dialog::backdrop{background:#14282066;backdrop-filter:blur(3px)}.searchbar{display:flex;border-bottom:1px solid var(--line);padding:17px;gap:12px}.searchbar input{border:0;outline:0;width:100%;background:transparent;color:inherit}.searchbar button{border:0;background:var(--soft);border-radius:4px;color:var(--muted)}#results{padding:10px;max-height:55vh;overflow:auto}#results a{display:block;padding:12px;border-radius:6px}#results a:hover{background:var(--tint)}#results small{display:block;color:var(--muted)}.skip{position:fixed;top:-100px;background:var(--bg);padding:10px;z-index:40}.skip:focus{top:0}@media(min-width:1450px){.workspace{padding-top:46px}}@media(max-width:1150px){.workspace{grid-template-columns:minmax(0,1fr);padding:35px}.toc{display:none}.toplinks{margin-left:0}.searchTrigger{width:220px}}@media(max-width:850px){header{padding:0 20px;gap:15px;height:65px}.toplinks{display:none}.layout{grid-template-columns:205px 1fr}.sidebar{top:65px;height:calc(100vh - 65px);padding-left:12px;padding-right:12px}.workspace{padding:30px 25px}.brand{font-size:17px}.version{display:none}.searchTrigger{width:190px}h1{font-size:36px}.cards{grid-template-columns:1fr}.flow{gap:5px}.node{padding:12px 8px}.architecture{padding:18px 12px}}@media(max-width:650px){.menu{display:block}.github{display:none}.searchTrigger{width:36px;padding:7px;justify-content:center}.searchTrigger span,.searchTrigger kbd{display:none}.layout{display:block}.sidebar{display:none;position:fixed;top:65px;left:0;width:250px;z-index:19;background:var(--bg);box-shadow:20px 0 45px #0002}.sidebar.open{display:flex}.workspace{padding:26px 22px}.breadcrumb{margin-bottom:25px}h1{font-size:36px}.lead{font-size:16px}.flow{flex-direction:column}.node{width:100%}.arrow{transform:rotate(90deg)}.actions{flex-wrap:wrap}.cards{grid-template-columns:1fr}.architecture{padding:20px}.sidebarfoot{margin-top:30px}footer{flex-direction:column}.tag{font-size:10px}}
p a,li a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.endpoint h3{margin-top:12px;overflow-wrap:anywhere}h1{font-size:40px}table{font-size:14px}.navlink{font-size:14px}.card p,.note{font-size:14px}code{font-size:13px}main{overflow-wrap:anywhere}</style></head><body><a class="skip" href="#main">Skip to content</a><header><button class="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button><a href="#overview" class="brand"><span class="logo" aria-hidden="true">⌘</span>mcp-iiq <span class="version">v0.4.0</span></a><nav class="toplinks"><a href="#overview">Documentation</a><a href="https://github.com/AngelN-Halo/mcp-iiq/blob/main/README.md" target="_blank" rel="noopener noreferrer">README ↗</a></nav><button class="searchTrigger" aria-label="Search documentation">⌕ <span>Search documentation…</span><kbd>⌘ K</kbd></button><a class="github" href="https://github.com/AngelN-Halo/mcp-iiq" target="_blank" rel="noopener noreferrer">GitHub ↗</a></header><div class="layout"><nav class="sidebar" aria-label="Documentation"></nav><div class="workspace"><main id="main" class="content" tabindex="-1"></main><aside class="toc" aria-label="On this page"></aside></div></div><dialog id="searchDialog"><div class="searchbar"><input id="searchInput" type="search" placeholder="Search the documentation…" aria-label="Search query"><button id="closeSearch" aria-label="Close search">Esc</button></div><div id="results"></div></dialog><noscript><p>This guide uses JavaScript for navigation. <a href="https://github.com/AngelN-Halo/mcp-iiq/blob/main/README.md">Read the complete README on GitHub.</a></p></noscript><div id="announce" aria-live="polite" style="position:absolute;left:-10000px"></div><script>
const repo='https://github.com/AngelN-Halo/mcp-iiq';
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const code=(s,label='terminal')=>`<div class="codebox"><div class="codehead"><span>${label}</span><button class="copy" aria-label="Copy ${label} code">Copy ⧉</button></div><pre><code>${esc(s)}</code></pre></div>`;
const note=s=>`<div class="note"><span aria-hidden="true">ⓘ</span><p>${s}</p></div>`;
const card=(id,icon,title,text)=>`<a class="card" href="#${id}"><div class="cardicon">${icon}</div><h3>${title}<span>↗</span></h3><p>${text}</p></a>`;
const pages={"overview": {"title": "Start with a ticket.", "nav": "Introduction", "group": "Getting started", "description": "Read ticket history, find assets, and bring Incident IQ context into your AI workspace through a read-only OpenAPI service.", "icon": "›", "html": "<div class=\"tags\"><span>Read-only</span><span>OpenAPI</span><span>Docker</span></div><div class=\"actions\"><a class=\"btn primary\" href=\"#quickstart\">Set up the service →</a><a class=\"btn\" href=\"#tickets\">Review a ticket →</a></div><div class=\"architecture\"><div class=\"smalllabel\">How it connects</div><div class=\"flow\"><div class=\"node\"><strong>Open WebUI</strong><small>Questions and tool calls</small></div><span class=\"arrow\">→</span><div class=\"node selected\"><strong>mcp-iiq</strong><small>Authenticated read-only gateway</small></div><span class=\"arrow\">→</span><div class=\"node\"><strong>Incident IQ</strong><small>Authorized tickets and assets</small></div></div></div><h2 id=\"capabilities\">What you can do</h2><div class=\"cards\"><a class=\"card\" href=\"#tickets\"><h3>Understand a ticket</h3><p>Retrieve its record and timeline, account for previous troubleshooting, and identify missing information.</p></a><a class=\"card\" href=\"#search\"><h3>Find related work</h3><p>Search by technician, requester, team, or category within supported date windows.</p></a><a class=\"card\" href=\"#assets\"><h3>Explore inventory</h3><p>Find assets by owner, tag, model, location, and other supported filters.</p></a><a class=\"card\" href=\"#investigation\"><h3>Investigate across systems</h3><p>Use matching identifiers to consult separately connected directory and network tools.</p></a></div><div class=\"note\"><p>Despite the repository name, version 0.4 exposes <strong>OpenAPI</strong>, not a native MCP transport. Register it as an OpenAPI connection.</p></div><h2 id=\"boundaries\">What stays under your control</h2><p>The service cannot update, assign, comment on, close, or delete tickets. It retrieves information; technicians review recommendations and take any resulting actions. This website is documentation only and has no connection to your tenant.</p>"}, "quickstart": {"title": "Install the gateway", "nav": "Quickstart", "group": "Getting started", "description": "Prepare a dedicated Incident IQ connection, start the container, and verify access.", "icon": "›", "html": "<h2 id=\"requirements\">Before you begin</h2><ul><li>A Docker host with Compose and Git.</li><li>An Incident IQ tenant and a dedicated read-only API token with access to the records you intend to query.</li><li>Nginx Proxy Manager, or an equivalent reverse proxy, for remote access over HTTPS.</li></ul><h2 id=\"download\">1. Get the source</h2><div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>git clone https://github.com/AngelN-Halo/mcp-iiq.git\ncd mcp-iiq\n./scripts/init_env.sh</code></pre></div><p>The initialization script creates a private .env file and generates a separate caller token. It leaves the IIQ tenant and token for you to fill in and does not overwrite an existing .env.</p><h2 id=\"credentials\">2. Configure your tenant</h2><p>Edit .env locally. Set IIQ_BASE_URL and IIQ_API_TOKEN. Supply IIQ_SITE_ID and IIQ_PRODUCT_ID when your tenant requires them. Keep the generated API_ACCESS_TOKEN separate from the upstream token.</p><h2 id=\"networks\">3. Prepare the networks</h2><p>The supplied Compose file expects two existing external networks. Confirm that your proxy is attached to proxy, and that the internal network matches IIQ_INTERNAL_NETWORK.</p><div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>docker network inspect proxy\ndocker network inspect iiq-internal</code></pre></div><p>If the internal network does not exist and you are using the default name, create it with <code>docker network create iiq-internal</code>. Create or select the proxy network as part of your reverse-proxy setup.</p><h2 id=\"start\">4. Build and verify</h2><div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>docker compose build\n./scripts/verify.sh\ndocker compose ps</code></pre></div><p>The verification script runs tests, starts the service, and checks the API surface, caller authentication, and proxy-network reachability. Verify a known ticket separately to confirm tenant access.</p><h2 id=\"connect\">5. Connect your workspace</h2><p>Follow the <a href=\"#connection\">Open WebUI and HTTPS guide →</a>. For a local liveness check:</p><div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>curl http://127.0.0.1:8085/health</code></pre></div><div class=\"note\"><p>Health reports configuration and liveness. It does not prove that your upstream token can retrieve an Incident IQ record.</p></div>"}, "configuration": {"title": "Configuration", "nav": "Configuration", "group": "Getting started", "description": "Keep upstream credentials on the server and give clients only the separate gateway token.", "icon": "›", "html": "<h2 id=\"variables\">Environment reference</h2><div class=\"tablewrap\"><table><tr><td><code>IIQ_BASE_URL</code></td><td>Tenant root, such as https://district.incidentiq.com.</td></tr><tr><td><code>IIQ_API_TOKEN</code></td><td>Dedicated upstream read-only token; stored server-side.</td></tr><tr><td><code>API_ACCESS_TOKEN</code></td><td>Separate bearer token for clients of this gateway.</td></tr><tr><td><code>IIQ_SITE_ID / IIQ_PRODUCT_ID</code></td><td>Tenant metadata, when required.</td></tr><tr><td><code>IIQ_CLIENT_HEADER</code></td><td>Upstream client header name; default ApiClient.</td></tr><tr><td><code>IIQ_INTERNAL_NETWORK</code></td><td>Existing internal Docker network; default iiq-internal.</td></tr><tr><td><code>IIQ_PUBLIC_BASE_URL</code></td><td>External HTTPS origin used for export download links. Set this behind a reverse proxy.</td></tr><tr><td><code>IIQ_TIMEOUT_SECONDS</code></td><td>Upstream timeout; default 20 seconds.</td></tr><tr><td><code>IIQ_MAX_RESPONSE_BYTES</code></td><td>Maximum upstream response size; default 5,000,000 bytes.</td></tr><tr><td><code>IIQ_VERIFY_SSL</code></td><td>Upstream TLS certificate verification; default true.</td></tr><tr><td><code>IIQ_EXPORT_MAX_ROWS</code></td><td>CSV row cap; default and hard maximum 25,000.</td></tr><tr><td><code>IIQ_EXPORT_PAGE_SIZE</code></td><td>Export fetch size; default 200.</td></tr><tr><td><code>IIQ_REPORT_TTL_SECONDS</code></td><td>Report lifetime; default 900 seconds; runtime bounds 60–3,600.</td></tr><tr><td><code>IIQ_ENABLE_ADVANCED_READ</code></td><td>Default false; keep disabled unless a reviewed need requires it.</td></tr><tr><td><code>IIQ_ALLOWED_READ_PREFIXES</code></td><td>Allowlisted resource prefixes for the optional advanced GET operation.</td></tr></table></div><div class=\"note\"><p>Never commit .env, paste tokens into prompts, or publish resolved configuration output containing secrets.</p></div><h2 id=\"source\">Configuration template</h2><p>Use the <a href=\"https://github.com/AngelN-Halo/mcp-iiq/blob/main/.env.example\">repository’s .env.example</a> for the complete current template. Restart the service after changing its environment.</p>"}, "connection": {"title": "Connect Open WebUI", "nav": "Open WebUI & HTTPS", "group": "Guides", "description": "Register the gateway as an OpenAPI tool and protect access through your reverse proxy.", "icon": "›", "html": "<h2 id=\"proxy\">Reverse proxy</h2><div class=\"tablewrap\"><table><tr><td>Forward hostname</td><td><code>mcp-iiq</code></td></tr><tr><td>Port</td><td><code>8085</code></td></tr><tr><td>Scheme to container</td><td><code>http</code></td></tr><tr><td>Client-facing URL</td><td>Your HTTPS gateway hostname</td></tr><tr><td>Schema path</td><td><code>/openapi.json</code></td></tr></table></div><p>Nginx Proxy Manager must share the proxy Docker network. Preserve the Authorization header. TLS may terminate at NPM or an upstream proxy; protect the full client-facing route.</p><p>The supplied Compose file also binds port 8085 to host loopback only: <code>127.0.0.1:8085</code>. It does not bind that port to every host interface.</p><h2 id=\"register\">Register the connection</h2><ol><li>In your Open WebUI administrator settings, add an OpenAPI tool connection.</li><li>Use your gateway URL and its /openapi.json schema, as required by your version.</li><li>Choose bearer authentication and supply API_ACCESS_TOKEN.</li><li>Verify that the Incident IQ operations are available, then test a known authorized ticket.</li></ol><div class=\"note\"><p>Do not configure this service as a native MCP endpoint. Never supply IIQ_API_TOKEN to the model or the Open WebUI tool connection.</p></div><h2 id=\"first\">First authenticated request</h2><p>Set API_ACCESS_TOKEN securely in your shell first. Replace the example hostname and ticket number.</p><div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>curl &#x27;https://iiq-gateway.example.com/tickets/by-number/T-100001/technician-context&#x27; \\\n  --header &quot;Authorization: Bearer $API_ACCESS_TOKEN&quot;</code></pre></div><h2 id=\"schema\">Interactive API documentation</h2><p>Your deployed service exposes /docs and /openapi.json. Those belong to your gateway, not this public documentation site.</p>"}, "tickets": {"title": "Review a ticket", "nav": "Ticket review", "group": "Guides", "description": "Start with a ticket number and retrieve the ticket record together with its normalized activity history.", "icon": "›", "html": "<h2 id=\"context\">Use the context operation</h2><p>Prefer <code>iiq_get_technician_ticket_context</code> for a technician review. It resolves a number such as T-100001 and combines the authorized ticket record with a chronological timeline.</p><p>The timeline defaults to 200 entries and accepts a limit up to 500. The standalone timeline operation defaults to 100 and allows up to 200. These are bounded results, so do not assume that every historical event was returned.</p><h2 id=\"prompt\">Example prompt</h2><div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>Review ticket T-100001. Summarize the issue and work already recorded, identify missing information, and recommend the next checks. Separate ticket facts from recommendations. Do not change the ticket.</code></pre></div><p>This is an illustrative prompt, not a live ticket or a recorded result.</p><h2 id=\"review\">A useful review</h2><ul><li>Current situation and ticket state.</li><li>Work and communication already recorded.</li><li>Missing or conflicting information.</li><li>Ordered next checks, with evidence for each recommendation.</li><li>Requester questions or routing suggestions only when needed.</li></ul><p>Preserve public versus internal timeline visibility. Do not copy internal notes into requester-facing text without technician review.</p><h2 id=\"reusable\">Reusable assistant instructions</h2><p>The repository includes a <a href=\"https://github.com/AngelN-Halo/mcp-iiq/blob/main/docs/technician-assistant-prompt.md\">technician assistant prompt</a> covering ticket reviews, searches, and inventory exports.</p>"}, "search": {"title": "Find the right tickets", "nav": "Ticket searches", "group": "Guides", "description": "Use exact identities and discovered taxonomy values instead of guessing at teams or categories.", "icon": "›", "html": "<h2 id=\"people\">Search by person</h2><p><code>iiq_search_tickets</code> searches an exact assigned-technician name in an inclusive creation-date window. <code>iiq_search_tickets_by_requester</code> searches recent tickets by an exact requested-for or submitted-by person.</p><h2 id=\"taxonomy\">Search by team or category</h2><ol><li>Call <code>iiq_find_ticket_filters</code> with the topic or team name.</li><li>Inspect the returned kinds and exact names.</li><li>Pass the selected kind and name to <code>iiq_search_tickets_filtered</code> with the requested creation-date window.</li></ol><p>A broad term may match several categories. Ask for clarification or search the explicitly relevant categories individually; do not silently select one.</p><h2 id=\"example\">Example prompt</h2><div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>Find the ticket categories related to display connectivity. Show the matching categories before searching tickets created between 2026-09-01 and 2026-09-07.</code></pre></div><p>Date windows refer to creation dates, not every activity that happened during the window. Refer to your deployed schema for required fields and result limits.</p>"}, "assets": {"title": "Assets, owners & exports", "nav": "Asset inventory", "group": "Guides", "description": "Look up an individual asset, count matching inventory, or produce a bounded CSV report.", "icon": "›", "html": "<h2 id=\"lookup\">Look up and filter</h2><p>Use <code>iiq_get_asset_by_tag</code> for an exact asset tag, or <code>iiq_get_asset</code> for a known IIQ asset identifier. Asset search supports owner, model, type, category, manufacturer, status, location, tag, serial number, and purchase-date filters.</p><h2 id=\"owners\">Match the owner precisely</h2><p>Prefer an exact owner_id. Email, username, and name selectors are also supported and checked against the resolved user. Ambiguous names are rejected. Current ownership describes the IIQ assignment, not historical checkouts or physical possession.</p><h2 id=\"limits\">Counts and limits</h2><p><code>iiq_search_assets</code> returns the upstream filtered total plus at most 200 compact summaries across no more than five pages. Check returned_count and truncated before describing the results as complete.</p><h2 id=\"exports\">Export a report</h2><p><code>iiq_export_assets_csv</code> uses the same filters and returns an expiring download link rather than filling model context with rows. Exports are capped at 25,000 rows and expire after 15 minutes by default.</p><div class=\"note\"><p>Possession of an unexpired report URL permits download. Treat it as sensitive and keep the gateway behind appropriate access controls. Exporting creates a temporary local report but does not modify Incident IQ records.</p></div><p>Set IIQ_PUBLIC_BASE_URL to your external HTTPS gateway origin so generated links use the correct address behind a proxy. Report files are temporary and can disappear when the container restarts.</p>"}, "investigation": {"title": "Investigate across systems", "nav": "Cross-system research", "group": "Guides", "description": "Use Incident IQ as the starting point, then consult other connected tools when the evidence calls for it.", "icon": "›", "html": "<h2 id=\"workflow\">An example investigation</h2><ol><li><strong>Read the ticket.</strong> Retrieve the description, recorded troubleshooting, and available user or asset details.</li><li><strong>Identify the relevant records.</strong> Use an exact email, asset identifier, IP, or MAC when available. Clarify ambiguous matches.</li><li><strong>Check the relevant system.</strong> Consult a separately connected Google Workspace tool for account details or Netdisco for network sightings and port context.</li><li><strong>Compare the evidence.</strong> Include source systems and timestamps. Separate observations, possible explanations, and missing information.</li><li><strong>Recommend the next check.</strong> A connection between records is not proof of a root cause.</li></ol><div class=\"note\"><p>This is an illustrative workflow. The assistant coordinates separate integrations; mcp-iiq does not automatically connect to other systems or implement a correlation engine.</p></div><h2 id=\"projects\">Related projects</h2><ul><li><a href=\"https://github.com/AngelN-Halo/open-webui-stack-starter\">Open WebUI Stack Starter</a> — self-hosted workspace.</li><li><a href=\"https://angeln-halo.github.io/mcp-iiq/\">Netdisco documentation</a> — device and switch-port lookups.</li><li><a href=\"https://github.com/AngelN-Halo/google-mcp\">Google Workspace Directory MCP</a> — read-only account and membership lookups.</li></ul><p>Configure each integration separately with its own credentials and access boundaries. The selected model provider determines where model processing occurs.</p>"}, "api": {"title": "Operation reference", "nav": "API operations", "group": "Reference", "description": "Named operations exposed by the current source. Consult your deployed OpenAPI schema for request and response models.", "icon": "›", "html": "<h2 id=\"auth\">Caller authentication</h2><div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>Authorization: Bearer &lt;API_ACCESS_TOKEN&gt;</code></pre></div><h2 id=\"operations\">Available operations</h2><div class=\"endpoint\"><span class=\"get\">GET</span><code>/tickets/{ticket_id}</code><h3>iiq_get_ticket</h3><p>Get one Incident IQ ticket</p></div><div class=\"endpoint\"><span class=\"get\">GET</span><code>/tickets/by-number/{ticket_number}</code><h3>iiq_get_ticket_by_number</h3><p>Get one Incident IQ ticket by ticket number</p></div><div class=\"endpoint\"><span class=\"get\">GET</span><code>/tickets/by-number/{ticket_number}/timeline</code><h3>iiq_get_ticket_timeline</h3><p>Get a ticket&#x27;s comments and activity timeline</p></div><div class=\"endpoint\"><span class=\"get\">GET</span><code>/tickets/by-number/{ticket_number}/technician-context</code><h3>iiq_get_technician_ticket_context</h3><p>Get complete read-only ticket context for technician review</p></div><div class=\"endpoint\"><span class=\"get\">POST</span><code>/tickets/search-by-requester</code><h3>iiq_search_tickets_by_requester</h3><p>Search recent tickets by requester name</p></div><div class=\"endpoint\"><span class=\"get\">POST</span><code>/ticket-filters/find</code><h3>iiq_find_ticket_filters</h3><p>Find valid IIQ ticket teams and categories</p></div><div class=\"endpoint\"><span class=\"get\">POST</span><code>/tickets/search-filtered</code><h3>iiq_search_tickets_filtered</h3><p>Search recent tickets by exact team or category</p></div><div class=\"endpoint\"><span class=\"get\">POST</span><code>/tickets/search</code><h3>iiq_search_tickets</h3><p>Search tickets by assigned technician and creation date</p></div><div class=\"endpoint\"><span class=\"get\">POST</span><code>/assets/search</code><h3>iiq_search_assets</h3><p>Search and count Incident IQ assets</p></div><div class=\"endpoint\"><span class=\"get\">POST</span><code>/assets/export</code><h3>iiq_export_assets_csv</h3><p>Export matching Incident IQ assets to a short-lived CSV</p></div><div class=\"endpoint\"><span class=\"get\">GET</span><code>/assets/by-tag/{asset_tag}</code><h3>iiq_get_asset_by_tag</h3><p>Find an Incident IQ asset by asset tag</p></div><div class=\"endpoint\"><span class=\"get\">GET</span><code>/assets/{asset_id}</code><h3>iiq_get_asset</h3><p>Get one Incident IQ asset</p></div><div class=\"endpoint\"><span class=\"get\">GET</span><code>/users/{user_id}</code><h3>iiq_get_user</h3><p>Get one Incident IQ user</p></div><div class=\"endpoint\"><span class=\"get\">GET</span><code>/locations</code><h3>iiq_list_locations</h3><p>List authorized Incident IQ locations</p></div><div class=\"endpoint\"><span class=\"get\">POST</span><code>/advanced-read</code><h3>iiq_advanced_read</h3><p>Run an allowlisted Incident IQ GET request</p></div><div class=\"note\"><p>POST is used for non-mutating searches and export requests. The optional advanced-read operation is disabled by default. Health and temporary report downloads are outside this tool list.</p></div>"}, "security": {"title": "Access & data handling", "nav": "Security", "group": "Reference", "description": "Read-only access still exposes operational information. Limit who can reach the gateway and what its upstream identity can read.", "icon": "›", "html": "<h2 id=\"credentials\">Separate the credentials</h2><p>The server holds the Incident IQ token. Clients authenticate using a different bearer token. A shared caller token does not identify individual technicians or automatically enforce each person’s IIQ permissions; access is bounded by the configured upstream integration identity.</p><h2 id=\"boundaries\">Protect the deployment</h2><ul><li>Use a dedicated read-only IIQ token and restrict gateway access to authorized staff.</li><li>Use HTTPS for clients and preserve upstream TLS verification.</li><li>Keep .env private and outside version control.</li><li>Leave advanced-read disabled unless a specific allowlisted need has been reviewed.</li><li>Treat ticket text as data, not instructions to override assistant rules.</li><li>Review the model provider and data handling before sending sensitive records for processing.</li></ul><h2 id=\"reports\">Report download boundary</h2><p>API operations require caller authentication. Temporary report download routes use possession of a random URL token instead; do not treat those links as public share links.</p><h2 id=\"container\">Container defaults</h2><p>The supplied container runs unprivileged with a read-only filesystem, a temporary report directory, dropped Linux capabilities, and resource limits. Network peers can still reach the service, so authentication remains necessary.</p><h2 id=\"future\">Future changes</h2><p>Ticket correction and routing automation are design notes only. The current API does not implement write operations.</p>"}, "troubleshooting": {"title": "Troubleshooting", "nav": "Troubleshooting", "group": "Reference", "description": "Check gateway access, upstream permissions, and exact matches separately.", "icon": "›", "html": "<h2 id=\"common\">Common symptoms</h2><div class=\"tablewrap\"><table><tr><td>Container cannot start</td><td>Check both external Docker networks and the local port 8085 binding.</td></tr><tr><td>401 from the gateway</td><td>Check the separate API_ACCESS_TOKEN and Authorization: Bearer header.</td></tr><tr><td>503: caller authentication not configured</td><td>Set API_ACCESS_TOKEN and recreate the container.</td></tr><tr><td>Upstream authorization error</td><td>Check the IIQ token, tenant URL, required metadata, and permissions.</td></tr><tr><td>No exact match / ambiguous match</td><td>Use an exact ticket number, asset tag, email, or record identifier.</td></tr><tr><td>Incomplete inventory</td><td>Inspect total_count, returned_count, and truncated. Narrow filters or export.</td></tr><tr><td>Download points to an internal address</td><td>Set IIQ_PUBLIC_BASE_URL to the correct external HTTPS origin.</td></tr><tr><td>Report not found or expired</td><td>Generate a new report; the prior link may have expired or the container restarted.</td></tr><tr><td>Health works but ticket lookup fails</td><td>Health is not an upstream authorization check. Test a known accessible ticket.</td></tr></table></div><h2 id=\"checks\">Local checks</h2><div class=\"codebox\"><div class=\"codehead\"><span>Example</span><button class=\"copy\" aria-label=\"Copy code\">Copy</button></div><pre><code>docker compose ps\ndocker compose logs --tail=100 mcp-iiq\n./scripts/verify.sh</code></pre></div><p>Review logs before sharing them. Report reproducible issues without credentials, personal records, or unexpired download links.</p>"}};
const sidebar=document.querySelector('.sidebar');let group='';sidebar.innerHTML=Object.entries(pages).map(([id,p])=>{let heading=p.group!==group?`<div class="navgroup">${p.group}</div>`:'';group=p.group;return heading+`<a class="navlink" href="#${id}" data-page="${id}"><span class="navicon" aria-hidden="true">${p.icon}</span>${p.nav}</a>`}).join('')+`<div class="sidebarfoot"><strong>Incident IQ, in context.</strong>Read-only tools for technicians.<br><a href="${repo}" target="_blank" rel="noopener noreferrer">View source on GitHub ↗</a></div>`;
function render(){const id=location.hash.slice(1).split('/')[0]||'overview';if(!pages[id])return;const p=pages[id];document.title=p.nav+' — mcp-iiq';document.querySelector('#main').innerHTML=`<div class="breadcrumb">Docs <span>›</span> ${p.group} <span>›</span><span>${p.nav}</span></div><div class="eyebrow">${id==='overview'?'Incident IQ documentation':p.group}</div><h1>${p.title}</h1><p class="lead">${p.description}</p>${p.html}<footer><span>mcp-iiq · Documentation</span><a href="${repo}/blob/main/README.md" target="_blank" rel="noopener noreferrer">Source documentation ↗</a></footer>`;document.querySelectorAll('.tags span').forEach(el=>el.classList.add('tag'));document.querySelectorAll('.navlink').forEach(a=>{a.classList.toggle('active',a.dataset.page===id);a.setAttribute('aria-current',a.dataset.page===id?'page':'false')});document.querySelector('.toc').innerHTML='<strong>On this page</strong>'+[...document.querySelectorAll('h2[id]')].map(h=>`<a href="#${id}/${h.id}" data-section="${h.id}">${h.textContent}</a>`).join('')+`<div class="help">Make these docs better.<a href="${repo}/issues" target="_blank" rel="noopener noreferrer">Open an issue ↗</a><a href="${repo}/blob/main/README.md" target="_blank" rel="noopener noreferrer">View source ↗</a></div>`;sidebar.classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false');const section=location.hash.split('/')[1];if(section)document.getElementById(section)?.scrollIntoView();else window.scrollTo(0,0);}
window.addEventListener('hashchange',render);render();
document.querySelector('.menu').onclick=e=>{let open=sidebar.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open)};
document.addEventListener('click',async e=>{const b=e.target.closest('.copy');if(!b)return;const text=b.closest('.codebox').querySelector('code').textContent;try{await navigator.clipboard.writeText(text);b.textContent='Copied ✓';document.querySelector('#announce').textContent='Code copied';}catch{const range=document.createRange();range.selectNodeContents(b.closest('.codebox').querySelector('code'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);b.textContent='Selected — use Ctrl/Cmd+C';} });
const dialog=document.querySelector('#searchDialog'),input=document.querySelector('#searchInput');function search(){let q=input.value.trim().toLowerCase();let matches=Object.entries(pages).filter(([id,p])=>(p.title+' '+p.nav+' '+p.description+' '+p.html.replace(/<[^>]*>/g,' ')).toLowerCase().includes(q));document.querySelector('#results').innerHTML=matches.length?matches.map(([id,p])=>`<a href="#${id}"><strong>${p.nav}</strong><small>${p.description}</small></a>`).join(''):'<p style="padding:12px">No matching pages. Try “ticket”, “owner”, or “token”.</p>';}function openSearch(){dialog.showModal();input.value='';search();input.focus()}document.querySelector('.searchTrigger').onclick=openSearch;document.querySelector('#closeSearch').onclick=()=>dialog.close();input.oninput=search;document.querySelector('#results').onclick=e=>{if(e.target.closest('a'))dialog.close()};dialog.onclick=e=>{if(e.target===dialog)dialog.close()};document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){sidebar.classList.remove('open');document.querySelector('.menu').setAttribute('aria-expanded','false')}});
</script></body></html>
